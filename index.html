<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Trend Hub - Fashion Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f8f8;
      color: #333;
    }
    header {
      background: #111;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav {
      background: #444;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .hero {
      background: url("https://picsum.photos/1600/500?fashion") no-repeat center center/cover;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2em;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .product {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .product img {
      max-width: 100%;
      border-radius: 5px;
    }
    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Global Trend Hub</h1>
    <p>Men's Fashion Jackets & More</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <section class="hero">
    New Season, New Style
  </section>

  <section class="products">
    <div class="product">
      <img src="https://picsum.photos/250/300?1" alt="Jacket 1">
      <h3>Softshell Jacket</h3>
      <p>£49.99</p>
    </div>
    <div class="product">
      <img src="https://picsum.photos/250/300?2" alt="Jacket 2">
      <h3>Winter Parka</h3>
      <p>£79.99</p>
    </div>
    <div class="product">
      <img src="https://picsum.photos/250/300?3" alt="Jacket 3">
      <h3>Lightweight Hoodie</h3>
      <p>£29.99</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Global Trend Hub | Contact: info@globaltrendhub.com</p>
  </footer>

</body>
</html>
